name: Build and Release TubeCourier

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Package extension archives for Firefox and Chrome
        run: |
          python3 package.py

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tubecourier-firefox.xpi
            dist/tubecourier-firefox.zip
            dist/tubecourier-chrome.zip
          generate_release_notes: true
          draft: false
          prerelease: false
